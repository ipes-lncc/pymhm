[workspace]
name = "pymhm"
version = "1.3.0"
requires-pixi = "==0.76.2"
description = "Composable multiscale hybrid mixed finite element methods"
channels = ["conda-forge"]
platforms = [
  "linux-64", "win-64", "osx-64", "osx-arm64",
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12.9" },
  { name = "win-64-cuda", platform = "win-64", cuda = "12.9" },
]

[dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26"
scipy = ">=1.12"
threadpoolctl = ">=3.2"
fenics-basix = ">=0.9"

[pypi-dependencies]
pymhm = { path = ".", editable = true }

[feature.dev.dependencies]
python-build = ">=1.2"
hatchling = ">=1.27"
mypy = ">=1.10"
pre-commit = ">=3.7"
ruff = ">=0.11"
twine = ">=5"

[feature.test.dependencies]
git = ">=2.25"
git-cliff = "==2.13.1"
pytest = ">=8"
pytest-cov = ">=5"
pytest-xdist = ">=3.6"
hypothesis = ">=6.116"
pyamg = ">=5.3"
fenics-ufl = ">=2024.2"

[feature.py311]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[feature.py312.dependencies]
python = "3.12.*"

[feature.native]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[feature.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5"

[feature.docs.pypi-dependencies]
mkdocstrings = { version = ">=0.27", extras = ["python"] }

[feature.docs.activation.env]
NO_MKDOCS_2_WARNING = "1"

[feature.notebooks.dependencies]
ipykernel = ">=6.29"
jupyterlab = ">=4"
nbclient = ">=0.10"
nbconvert-core = ">=7"
nbformat = ">=5.10"
meshio = ">=5.3"
matplotlib-base = ">=3.8"
pyamg = ">=5.3"

[feature.visualization.dependencies]
matplotlib-base = ">=3.8"

[feature.notebook-tests.dependencies]
ipykernel = ">=6.29"
nbclient = ">=0.10"
nbformat = ">=5.10"
matplotlib-inline = ">=0.1.7"

[feature.visualization.pypi-dependencies]
pyvista = ">=0.46,<0.50"
vtk = ">=9.5,<9.7"

[feature.packaging.dependencies]
rattler-build = ">=0.40"
actionlint = ">=1.7"

[feature.release.dependencies]
git = ">=2.25"
git-cliff = "==2.13.1"

[feature.release.tasks]
release-fetch = "git fetch origin +refs/heads/main:refs/remotes/origin/main --tags"
changelog-preview = "python -m scripts.release preview"
release-prepare = "python -m scripts.release prepare"
version-set = "python -m scripts.release prepare"
version-check = "python -m scripts.release check"

[feature.meshing.dependencies]
python-gmsh = ">=4.13"
meshio = ">=5.3"
netgen = ">=6.2"

[feature.freefem]
platforms = ["linux-64", "linux-64-cuda"]

[feature.freefem.dependencies]
freefem = { version = ">=4.13,<5", build = "*nompi*" }

[feature.fem]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[feature.fem.dependencies]
fenics-dolfinx = ">=0.9,<0.11"
mpi4py = ">=4"

[feature.fem.target.unix.dependencies]
petsc4py = ">=3.22"

[feature.introduction.dependencies]
fenics-dolfinx = "0.9.*"

[feature.fem-gpu]
platforms = ["linux-64-cuda"]

[feature.fem-gpu.dependencies]
fenics-dolfinx = ">=0.9,<0.11"
mpi4py = ">=4"
petsc4py = ">=3.22"

[feature.intel]
platforms = ["linux-64", "win-64", "linux-64-cuda"]

[feature.intel.dependencies]
mkl = ">=2024"
pypardiso = ">=0.4"

[feature.gpu]
platforms = ["linux-64-cuda", "win-64-cuda"]

[feature.gpu.dependencies]
cuda-version = "12.9.*"
cupy = ">=13"

[feature.gpu.pypi-dependencies]
nvmath-python = ">=1.0,<1.1"
nvidia-cudss-cu12 = "==0.8.*"
cuda-bindings = ">=12.9.2,<13"

[feature.hpc]
platforms = ["linux-64-cuda"]

[feature.hpc.dependencies]
mpi4py = ">=4"
petsc4py = ">=3.22"

[feature.full-test]
platforms = ["linux-64-cuda"]

[feature.full-test.dependencies]
python = "3.13.*"

[feature.full-test.activation.env]
CUDA_PATH = "$CONDA_PREFIX/targets/x86_64-linux"
PYVISTA_OFF_SCREEN = "true"

[feature.full-test.tasks]
test-dependencies = "python scripts/check_test_dependencies.py"
test = { cmd = "python scripts/run_tests.py", depends-on = ["test-dependencies"] }
coverage-run = { cmd = "python scripts/run_tests.py --coverage", depends-on = ["test-dependencies"] }
test-parallel = { cmd = "python scripts/run_tests.py", depends-on = ["test-dependencies"] }
test-setup-amgx = "pixi run --locked --manifest-path tools/amgx/pixi.toml python scripts/build_amgx.py --target-python .pixi/envs/test/bin/python"

[tasks]
amgx-lock-check = "pixi list --locked --no-install --manifest-path tools/amgx/pixi.toml"
lock-check = { cmd = "pixi list --locked --no-install -e test-core", depends-on = ["amgx-lock-check"] }
source-check = "python scripts/check_source_structure.py"
lint = { cmd = "ruff check src tests scripts benchmarks examples", depends-on = ["source-check"] }
format = "ruff format src tests scripts benchmarks examples"
format-check = "ruff format --check src tests scripts benchmarks examples"
typecheck = "mypy"
test = "python scripts/run_tests.py"
coverage-run = "python scripts/run_tests.py --coverage"
test-cov = { cmd = "python scripts/check_coverage.py build/reports/coverage/coverage.json", depends-on = ["coverage-run"] }
test-parallel = "python scripts/run_tests.py"
test-fem = "python scripts/run_tests.py -- -m 'fem and not mpi and not gpu'"
test-fem-portable = "python scripts/run_tests.py -- tests/test_fenics_portability.py"
fem-portable-check = "python tests/fenics_portability_probe.py --solver scipy --report build/reports/fem-portable-scipy.json"
fem-portable-pardiso-check = "python tests/fenics_portability_probe.py --solver pypardiso --report build/reports/fem-portable-pardiso.json"
test-fem-cov = "python scripts/run_tests.py --coverage --report-dir build/reports/fem-coverage -- -m 'fem and not mpi and not gpu'"
test-mpi = "python scripts/run_tests.py -- -m 'mpi and not gpu'"
test-meshing = "python scripts/run_tests.py -- -m meshing"
test-visualization = "python scripts/run_tests.py -- -m '(visualization or notebooks) and not gpu'"
build = "python -m build --no-isolation"
check-dist = "python scripts/check_distribution.py"
conda-build = "rattler-build build --recipe recipe/recipe.yaml --output-dir build/conda --no-include-recipe"
ci-check = "actionlint"
metadata-check = "python scripts/check_metadata.py"
notebooks-run = "python scripts/run_notebooks.py"
notebook-plan = "python scripts/run_notebooks.py --plan"
notebooks-check = "python scripts/notebook_reproduction.py --check"
gallery-darcy = "python -m examples.plot_darcy_cases"
gallery-darcy-audit = "python -m examples.plot_darcy_audit"
gallery-reference = "python -m examples.plot_reference_comparison"
gallery-neopz = "python -m examples.plot_neopz_comparison"
gallery-flow = "python -m examples.plot_flow_cases"
gallery-flow-audit = "python -m examples.plot_flow_audit"
gallery-scalars = "python -m examples.plot_scalar_elasticity"
gallery-elasticity = "python -m examples.plot_elasticity"
gallery-tetra-pk = "python -m examples.plot_tetra_pk"
gallery-star-polyhedra = "python -m examples.plot_star_polyhedra"
gallery-mixed-elasticity3d = "python -m examples.plot_mixed_elasticity3d"
gallery-mixed-elasticity = "python -m examples.plot_mixed_elasticity"
gallery-elasticity-reference = "python -m examples.plot_elasticity_reference"
gallery-darcy-bdm = "python -m examples.plot_darcy_bdm"
gallery-native-extensions = "python -m examples.plot_native_extensions"
gallery-reconstruction = "python -m examples.plot_reconstruction_moments"
gallery-estimator = "python -m examples.plot_estimator"
gallery-performance = "python -m examples.plot_performance"
gallery-large = "python -m examples.plot_large_local"
gallery-published = "python -m examples.plot_reproductions"
gallery-convergence = "python -m examples.plot_verification"
gallery-spe10-data = "python -m examples.plot_spe10_data --layers-only"
gallery-spe10-darcy = "python -m examples.plot_spe10_darcy"
gallery-spe10-flux = "python -m examples.plot_spe10_flux"
gallery-spe10-brinkman = "python -m examples.plot_spe10_brinkman"
gallery-spe10-taylor-hood = "python -m examples.plot_spe10_taylor_hood"
gallery-quarter-spot = "python -m examples.plot_quarter_spot"
gallery-quarter-reference = "python -m examples.plot_quarter_reference"
gallery-quarter-elevation = "python -m examples.plot_quarter_elevation"
gallery-quarter-geometry = "python -m examples.plot_quarter_geometry"
gallery-quarter-classical = "python -m examples.plot_quarter_classical"
gallery = { depends-on = ["gallery-darcy", "gallery-darcy-audit", "gallery-reference", "gallery-neopz", "gallery-flow", "gallery-flow-audit", "gallery-scalars", "gallery-elasticity", "gallery-mixed-elasticity", "gallery-elasticity-reference", "gallery-darcy-bdm", "gallery-native-extensions", "gallery-reconstruction", "gallery-estimator", "gallery-performance", "gallery-large", "gallery-published", "gallery-convergence"] }
gallery-oseen = "python -m examples.plot_oseen"
gallery-helmholtz-article = "python -m examples.plot_helmholtz_article"
gallery-maxwell-nanoguide = "python -m examples.maxwell_nanoguide_results --plot"
gallery-elastodynamics = "python -m examples.elastodynamics_results"
campaign-elastodynamics = "python -m examples.elastodynamics_campaign"
campaign-maxwell-nanoguide = "python -m examples.maxwell_nanoguide"
campaign-helmholtz-stability = "python -m examples.helmholtz_stability"
gallery-mixed-well = "python -m examples.plot_mixed_well_geometries"
mh2m-campaign = "python -m examples.mh2m_campaign"
mh2m-trace-campaign = "python -m examples.mh2m_trace_campaign"
gallery-mh2m = "python -m examples.plot_mh2m"
mh2m-heterogeneous-campaign = "python -m examples.mh2m_heterogeneous --references 32 64 128 256 512 1024 --norm-workers 8"
gallery-mh2m-heterogeneous = "python -m examples.plot_mh2m_heterogeneous"
gallery-mh2m-cg3 = "python -m examples.plot_mh2m_cg3"
mh2m-cg3-comparison = "python -m examples.compare_mh2m_cg3"
mh2m-cg3-controls = "python -m examples.compare_mh2m_cg3_controls"
campaign-mh3d = "python -m examples.mh3d_campaign"
gallery-mh3d = "python -m examples.plot_mh3d"
unusual-campaign = "python -m examples.solve_unusual"
gallery-unusual = "python -m examples.plot_unusual"
verify-mshho = "python -m examples.verify_mshho"
verify-tensor-rt = "python -m examples.verify_tensor_rt"
verify-polygons = "python -m examples.verify_polygons"
verify-transport = "python -m examples.transport_campaign --collect"
verify-nested = "python -m examples.verify_nested"
verify-weighted-estimator = "python -m examples.verify_weighted_estimator"
verify-periodic = "python -m examples.verify_periodic"
verify-analytic = "python -m examples.verify_analytic"
verify-rad-conditioning = "python -m examples.verify_rad_conditioning"
verify-rad-layer = "python -m examples.verify_rad_layer"
benchmark = "python benchmarks/scaling.py"
benchmark-large = "python benchmarks/large_local.py"
benchmark-gpu = "python benchmarks/gpu.py"
precommit = "pre-commit run --all-files"
docs-build = "mkdocs build --strict"
docs-check = { cmd = "python scripts/check_docs_math.py", depends-on = ["docs-build"] }
docs-serve = "mkdocs serve"

[feature.notebooks.tasks]
tutorials-render = "python scripts/render_tutorials.py"

[feature.notebooks.tasks.mh-campaign]
cmd = "python -m examples.mh_campaign --workers 8"

[feature.notebooks.tasks.gallery-mh]
cmd = "python -m examples.plot_mh"

[feature.notebooks.tasks.flow3d-campaign]
cmd = "python -m examples.solve_flow3d"

[feature.notebooks.tasks.gals3d-campaign]
cmd = "python -m examples.solve_gals3d"

[feature.notebooks.tasks.gallery-gals3d]
cmd = "python -m examples.plot_gals3d"

[feature.notebooks.tasks.pgmhm-campaign]
cmd = "python -m examples.pgmhm_campaign"

[feature.notebooks.tasks.gallery-pgmhm]
cmd = "python -m examples.plot_pgmhm"

[feature.notebooks.tasks.gallery-flow3d]
cmd = "python -m examples.plot_flow3d"

[feature.notebooks.tasks.planar3d-campaign]
cmd = "python -m examples.solve_planar3d"

[feature.notebooks.tasks.gallery-planar3d]
cmd = "python -m examples.plot_planar3d"

[feature.notebooks.tasks.helmholtz-campaign]
cmd = "python -m examples.helmholtz_campaign --workers 8"

[feature.notebooks.tasks.gallery-helmholtz]
cmd = "python -m examples.plot_helmholtz"

[feature.notebooks.tasks.reconstruction3d-uniform]
cmd = "python -m examples.solve_reconstruction3d uniform"

[feature.notebooks.tasks.reconstruction3d-adaptive]
cmd = "python -m examples.solve_reconstruction3d adaptive"

[feature.notebooks.tasks.reconstruction3d-resolution]
cmd = "python -m examples.reconstruction3d_resolution"

[feature.notebooks.tasks.gallery-reconstruction3d]
cmd = "python -m examples.plot_reconstruction3d"

[feature.notebooks.tasks.reconstruction3d-rt-order]
cmd = "python -m examples.reconstruction3d_rt_order"

[feature.notebooks.tasks.maxwell-campaign]
cmd = "python -m examples.maxwell_campaign"

[feature.notebooks.tasks.gallery-maxwell]
cmd = "python -m examples.plot_maxwell"

[environments]
default = { features = ["native", "dev", "test"], solve-group = "core" }
test-core = { features = ["native", "dev", "test"], solve-group = "core" }
test = { features = ["dev", "test", "fem-gpu", "notebooks", "visualization", "meshing", "gpu", "intel", "freefem", "full-test"], solve-group = "full-test" }
test-py311 = { features = ["dev", "test", "py311"], solve-group = "py311" }
test-py312 = { features = ["dev", "test", "py312"], solve-group = "py312" }
docs = { features = ["native", "docs"], solve-group = "docs" }
notebooks = { features = ["native", "notebooks", "visualization"], solve-group = "notebooks" }
introduction = { features = ["dev", "test", "fem", "notebooks", "introduction"], solve-group = "introduction" }
introduction-intel = { features = ["dev", "test", "fem", "notebooks", "introduction", "intel"], solve-group = "introduction-intel" }
introduction-gpu = { features = ["dev", "test", "fem-gpu", "notebooks", "introduction", "gpu"], solve-group = "introduction-gpu" }
packaging = { features = ["native", "dev", "packaging"], solve-group = "packaging" }
release = { features = ["native", "dev", "release"], solve-group = "release" }
meshing = { features = ["native", "dev", "test", "meshing"], solve-group = "meshing" }
fem = { features = ["dev", "test", "fem"], solve-group = "fem" }
fem-intel = { features = ["dev", "test", "fem", "intel"], solve-group = "fem-intel" }
remeshing = { features = ["dev", "test", "freefem"], solve-group = "remeshing" }
intel = { features = ["dev", "test", "intel"], solve-group = "intel" }
gpu = { features = ["dev", "test", "gpu"], solve-group = "gpu" }
hpc = { features = ["dev", "test", "gpu", "hpc"], solve-group = "hpc" }

visualization = { features = ["native", "dev", "test", "visualization", "notebook-tests"], solve-group = "visualization" }
