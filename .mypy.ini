[mypy]
# Current NumPy stubs use PEP 695; Ruff and the Python 3.11 job check source compatibility.
python_version = 3.12
files = src/pymhm
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[mypy-scipy.*]
ignore_missing_imports = true

[mypy-dolfinx.*]
ignore_missing_imports = true

[mypy-ufl.*]
ignore_missing_imports = true

[mypy-basix.*]
ignore_missing_imports = true

[mypy-mpi4py.*]
ignore_missing_imports = true

[mypy-petsc4py.*]
ignore_missing_imports = true

[mypy-pypardiso.*]
ignore_missing_imports = true

[mypy-cupy.*]
ignore_missing_imports = true

[mypy-nvmath.*]
ignore_missing_imports = true

[mypy-threadpoolctl.*]
ignore_missing_imports = true

[mypy-pyamg.*]
ignore_missing_imports = true

[mypy-pyamgx.*]
ignore_missing_imports = true

[mypy-gmsh.*]
ignore_missing_imports = true

[mypy-meshio.*]
ignore_missing_imports = true

[mypy-netgen.*]
ignore_missing_imports = true

[mypy-pyvista.*]
ignore_missing_imports = true
