nav:
- Overview: index.md
- Installation: installation.md
- Mathematical foundations: theory.md
- Literature and scope: literature.md
- Architecture: architecture.md
- Mesh generation: meshing.md
- Cartesian Qk Darcy: quadrilateral.md
- PyVista visualization: visualization.md
- FEniCS local forms: fenics.md
- Linear solvers: solvers.md
- MPI, GPU and operator reuse: execution.md
- Tutorials: tutorials.md
- Case gallery:
  - Evidence guide: cases/index.md
  - Initial convergence studies: cases/minimal-convergence.md
  - Recursive MHM: cases/nested.md
  - MHM–MsHHO: cases/mshho.md
  - Quarter-five spot and obstacle: cases/quarter-five-spot.md
  - MsHHO in 3D: cases/mshho3d.md
  - Mixed H(div) in 3D: cases/enriched-hdiv3d.md
- Verification: verification.md
- API reference:
  - Overview: api.md
  - Meshes and geometric refinement: api/geometry.md
  - Materials and reservoir data: api/materials.md
  - Mesh exchange and visualization: api/meshing.md
  - Hybrid operators and multiscale constructions: api/hybrid.md
  - Robin MH and three-field MH²M: api/mh.md
  - Darcy in two dimensions: api/darcy.md
  - Darcy in three dimensions: api/darcy3d.md
  - Flux reconstruction and error estimation: api/reconstruction.md
  - Adaptive scalar and elasticity indicators: api/adaptivity.md
  - Stokes, Brinkman and Oseen: api/flow.md
  - Elasticity: api/elasticity.md
  - Transport, reaction and diffusion: api/transport.md
  - Finite element bases: api/elements.md
  - Helmholtz and Maxwell: api/waves.md
  - Solvers and execution backends: api/backends.md
- Roadmap: roadmap.md
- Development: development.md
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths:
        - src
        options:
          docstring_style: numpy
          show_source: true
          show_signature_annotations: true
          members_order: source
markdown_extensions:
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.arithmatex:
    generic: true
extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
- javascripts/figures.js
extra_css:
- stylesheets/extra.css
