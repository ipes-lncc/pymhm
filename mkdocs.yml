site_name: PyMHM
site_description: Composable Multiscale Hybrid Mixed finite element methods in Python
site_url: https://ipes-lncc.github.io/pymhm/
repo_url: https://github.com/ipes-lncc/pymhm
repo_name: ipes-lncc/pymhm
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  logo: assets/branding/pymhm-icon.svg
  favicon: assets/branding/pymhm-icon.svg
  font: false
  features:
  - navigation.sections
  - navigation.tracking
  - navigation.top
  - navigation.footer
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
