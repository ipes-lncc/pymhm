site_name: pymhm
site_description: Composable multiscale hybrid mixed finite element methods
site_url: https://volpatto.github.io/pymhm/
repo_url: https://github.com/volpatto/pymhm
repo_name: volpatto/pymhm
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy
  palette:
  - scheme: default
    primary: teal
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: teal
    accent: cyan
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
exclude_docs: '/cases/adaptive-darcy.md

