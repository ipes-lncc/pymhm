nav:
  - Overview: index.md
  - Installation: installation.md
  - Mathematical foundations: theory.md
  - Literature and scope: literature.md
  - Architecture: architecture.md
  - Mesh generation: meshing.md
  - Cartesian Qk Darcy: quadrilateral.md
  - PyVista visualization: visualization.md
  - FEniCS local forms: fenics.md
  - Linear solvers: solvers.md
  - MPI, GPU and operator reuse: execution.md
  - Tutorials: tutorials.md
  - Case gallery:
      - Evidence guide: cases/index.md
      - Published curves: cases/reproduction.md
      - Multiscale constructions:
          - Recursive MHM: cases/nested.md
          - MHM–MsHHO equivalence: cases/mshho.md
      - Darcy and heterogeneous media:
          - Quarter-five spot and square obstacle: cases/quarter-five-spot.md
          - Periodic permeability: cases/periodic.md
          - Rectangular mixed spaces: cases/tensor-rt.md
          - Tetrahedral and prismatic wells: cases/mixed-well-geometries.md
          - Oscillatory mixed well: cases/mapped-well-oscillatory.md
          - SPE10 Darcy and Brinkman: cases/spe10.md
          - SPE10 flux references: cases/spe10-flux.md
          - Adaptive SPE10: cases/spe10-adaptive.md
          - Unfitted interfaces: cases/unfitted.md
          - Reconstruction and estimation in 3D: cases/reconstruction3d.md
          - MH²M oscillatory medium: cases/mh2m-heterogeneous.md
      - Transport and polytopes:
          - Adaptive RAD: cases/adaptive-transport.md
          - Transient Darcy transport: cases/transient-transport.md
          - MHM-USFEM reaction–diffusion: cases/unusual.md
          - Polygonal and polyhedral families: cases/polygons.md
      - Stokes, Brinkman and Oseen:
          - Stokes–Brinkman adaptation: cases/stokes-adaptive.md
          - Adaptive Oseen: cases/oseen.md
      - Elasticity:
          - Mixed stress families: cases/mixed-families.md
          - Mixed AFW in 3D: cases/mixed-elasticity3d.md
          - Locking-free displacement–pressure: cases/elasticity.md
          - HPC4e heterogeneous material: cases/hpc4e.md
      - Waves:
          - Helmholtz: cases/helmholtz.md
          - Marmousi: cases/marmousi.md
          - Maxwell nanowaveguide: cases/maxwell-nanoguide.md
          - Elastodynamics: cases/elastodynamics.md
  - Verification: verification.md
  - API reference:
      - Overview: api.md
      - Meshes and geometric refinement: api/geometry.md
      - Materials and reservoir data: api/materials.md
      - Mesh exchange and visualization: api/meshing.md
      - Hybrid operators and multiscale constructions: api/hybrid.md
      - Robin MH and three-field MH²M: api/mh.md
      - Darcy in two dimensions: api/darcy.md
      - Darcy in three dimensions: api/darcy3d.md
      - Flux reconstruction and error estimation: api/reconstruction.md
      - Adaptive scalar and elasticity indicators: api/adaptivity.md
      - Stokes, Brinkman and Oseen: api/flow.md
      - Elasticity: api/elasticity.md
      - Transport, reaction and diffusion: api/transport.md
      - Finite element bases: api/elements.md
      - Helmholtz and Maxwell: api/waves.md
      - Solvers and execution backends: api/backends.md
  - Roadmap: roadmap.md
  - Development: development.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_signature_annotations: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - javascripts/figures.js

extra_css:
  - stylesheets/extra.css
