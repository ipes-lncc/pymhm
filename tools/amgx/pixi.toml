[workspace]
name = "pymhm-amgx-build"
requires-pixi = "==0.76.2"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
numpy = ">=2"
cython = ">=3"
setuptools = ">=70"
pip = ">=25"
wheel = ">=0.45"
cmake = ">=3.28"
ninja = ">=1.12"
patchelf = ">=0.17"
git = ">=2.45"
cuda-version = "12.6.*"
cuda-nvcc = "12.6.*"
cuda-cudart-dev = "12.6.*"
libcublas-dev = "*"
libcusparse-dev = "*"
libcusolver-dev = "*"
libcurand-dev = ">=10.3.7.77,<11"
cuda-nvtx = "12.6.*"
gxx_linux-64 = "12.*"

[tasks]
install-amgx = "python ../../scripts/build_amgx.py"
