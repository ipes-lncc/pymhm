name: Lint and Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  quality:
    name: Quality and release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: test-core packaging
          locked: true
          cache: true
      - name: Check synchronized versions and changelog
        run: pixi run --locked -e test-core python -m scripts.release check
      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pixi run --locked -e test-core metadata-check --tag "$RELEASE_TAG"
      - run: pixi run --locked -e test-core lint
      - run: pixi run --locked -e test-core format-check
      - run: pixi run --locked -e test-core typecheck
      - run: pixi run --locked -e packaging ci-check
      - run: pixi run --locked -e test-core build
      - run: pixi run --locked -e test-core check-dist
      - name: Test the installed release wheel outside the checkout
        run: >-
          pixi run --locked -e test-core python scripts/check_portable_wheel.py
          dist --report build/reports/portable-wheel.json
      - run: pixi run --locked -e packaging conda-build
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: conda-distribution
          path: build/conda/noarch/*.conda
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-wheel-validation
          path: build/reports/portable-wheel.*
