name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked documentation from main or a release tag
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      publish:
        description: Publish the checked documentation for a validated release tag
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}-${{ inputs.publish && 'publish' || 'check' }}
  cancel-in-progress: ${{ !inputs.publish && github.ref_type != 'tag' }}

env:
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  build:
    name: Documentation and mathematical markup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: docs
          locked: true
          cache: true
      - run: pixi run --locked -e docs docs-check
      - name: Upload the validated site
        if: >-
          inputs.publish && github.repository == 'ipes-lncc/pymhm' &&
          ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Publish validated documentation
    needs: build
    if: >-
      inputs.publish && github.repository == 'ipes-lncc/pymhm' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy the validated site
        id: deployment
        uses: actions/deploy-pages@v5
