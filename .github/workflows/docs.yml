name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Publish the checked documentation for a validated release tag
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  build:
    name: Documentation and mathematical markup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: docs
          locked: true
          cache: true
      - run: pixi run --locked -e docs docs-check
      - name: Upload the validated release site
        if: >-
          inputs.publish && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
          github.repository == 'volpatto/pymhm'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Publish validated release documentation
    needs: build
    if: >-
      inputs.publish && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'volpatto/pymhm'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy the validated release site
        id: deployment
        uses: actions/deploy-pages@v5
