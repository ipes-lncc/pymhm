name: Full native integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-integration
  cancel-in-progress: false

jobs:
  full-native:
    name: Complete CPU and two-GPU test suite
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 60
    env:
      PYTHONFAULTHANDLER: "1"
      PYVISTA_OFF_SCREEN: "true"
      MPLBACKEND: "Agg"
      OMP_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: test
          locked: true
      - name: Build pinned native AmgX and PyAMGX
        run: pixi run --locked -e test test-setup-amgx
      - name: Require the complete native stack and two CUDA devices
        run: pixi run --locked -e test test-dependencies
      - name: Run the complete suite with all available CPUs and isolated serial tests
        run: pixi run --locked -e test test-cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-full-native-linux-cuda
          path: build/reports/coverage/
