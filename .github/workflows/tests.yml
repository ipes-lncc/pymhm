name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_native:
        description: Run the complete native suite on the two-GPU self-hosted runner
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      full_native:
        description: Run the complete native suite on the two-GPU self-hosted runner
        type: boolean
        required: false
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  workspace:
    name: Validate the complete locked workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          run-install: false
          cache: false
      - name: Check every environment and platform without installing
        run: pixi list --locked --no-install -e test-core --json > /dev/null
      - name: Check the pinned AmgX toolchain without installing
        run: >-
          pixi list --locked --no-install --manifest-path tools/amgx/pixi.toml
          --json > /dev/null

  core:
    name: Core (${{ matrix.os }}, ${{ matrix.environment }})
    needs: workspace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, environment: test-core}
          - {os: windows-latest, environment: test-core}
          - {os: macos-latest, environment: test-core}
          - {os: ubuntu-latest, environment: test-py311}
          - {os: ubuntu-latest, environment: test-py312}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: ${{ matrix.environment }}
          locked: true
          cache: true
      - name: Check metadata
        run: pixi run --locked -e ${{ matrix.environment }} metadata-check
      - name: Run tests with branch coverage
        env:
          PYTEST_ADDOPTS: --junitxml=build/reports/tests/junit.xml
        run: pixi run --locked -e ${{ matrix.environment }} coverage-run
      - name: Build a portable wheel on Windows
        if: runner.os == 'Windows'
        run: >-
          pixi run --locked -e ${{ matrix.environment }} python -m build
          --wheel --no-isolation --outdir build/windows-wheel
      - name: Test the installed Windows wheel outside the checkout
        if: runner.os == 'Windows'
        run: >-
          pixi run --locked -e ${{ matrix.environment }} python scripts/check_portable_wheel.py
          build/windows-wheel --report build/reports/windows-wheel.json
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && always()
        with:
          name: wheel-windows-${{ matrix.environment }}
          path: build/reports/windows-wheel.*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.environment }}
          path: |
            build/reports/tests/*.xml
            build/reports/coverage/coverage.xml
      - name: Retain the Linux core coverage measurement
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.environment == 'test-core'
        with:
          name: coverage-core-linux
          path: build/reports/coverage/.coverage
          include-hidden-files: true
          if-no-files-found: error

  visualization:
    name: Graphics and notebook execution contracts
    needs: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYVISTA_OFF_SCREEN: "true"
      MPLBACKEND: "Agg"
      LIBGL_ALWAYS_SOFTWARE: "1"
      VTK_DEFAULT_OPENGL_WINDOW: "vtkEGLRenderWindow"
    steps:
      - uses: actions/checkout@v7
      - name: Install the headless Mesa OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libopengl0 libxrender1
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: visualization
          locked: true
          cache: true
      - name: Verify the locked graphics stack with an actual EGL render
        run: |
          pixi run --locked -e visualization python - <<'PY'
          import ctypes
          import matplotlib
          import pyvista as pv
          import vtk

          ctypes.CDLL("libEGL.so.1")
          ctypes.CDLL("libEGL_mesa.so.0")
          print("Matplotlib:", matplotlib.__version__, flush=True)
          print("PyVista:", pv.__version__, flush=True)
          print("VTK:", vtk.vtkVersion.GetVTKVersion(), flush=True)
          plotter = pv.Plotter(off_screen=True, window_size=(64, 64))
          try:
              backend = plotter.ren_win.GetClassName()
              print("Render backend:", backend, flush=True)
              assert backend == "vtkEGLRenderWindow", backend
              plotter.add_mesh(pv.Sphere())
              image = plotter.screenshot()
              assert image.shape == (64, 64, 3)
              assert int(image.max()) - int(image.min()) > 100
              print(plotter.ren_win.ReportCapabilities(), flush=True)
          finally:
              plotter.close()
          PY
      - name: Exercise notebook execution, graphic contracts and native offscreen rendering
        env:
          PYTEST_ADDOPTS: --junitxml=build/reports/tests/visualization.xml
        run: pixi run --locked -e visualization test-visualization
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-visualization-linux
          path: build/reports/tests/visualization-*.xml

  integration:
    name: ${{ matrix.label }} (${{ matrix.os }})
    needs: core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Hosted VMs use sockets and shared memory, without requiring RDMA devices.
      UCX_TLS: tcp,sm,self
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: fem, label: DOLFINx and PETSc, os: ubuntu-latest, environment: fem}
          - {kind: fem-portable, label: DOLFINx with SciPy and PARDISO, os: ubuntu-latest, environment: fem-intel}
          - {kind: fem-portable, label: DOLFINx with SciPy and PARDISO, os: windows-latest, environment: fem-intel}
          - {kind: fem-portable, label: DOLFINx with SciPy, os: macos-latest, environment: fem}
          - {kind: mpi, label: MPI and MUMPS, os: ubuntu-latest, environment: fem}
          - {kind: intel, label: PARDISO, os: ubuntu-latest, environment: intel}
          - {kind: intel, label: PARDISO, os: windows-latest, environment: intel}
    steps:
      - uses: actions/checkout@v7
      - name: Activate the Windows C compiler for UFL JIT
        if: matrix.kind == 'fem-portable' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: ${{ matrix.environment }}
          locked: true
          cache: true
      - name: Require native DOLFINx assembly without selecting PETSc
        if: matrix.kind == 'fem-portable'
        run: >-
          pixi run --locked -e ${{ matrix.environment }} python -c
          'import dolfinx, basix, ufl; from dolfinx import fem, mesh;
          from mpi4py import MPI; print("DOLFINx:", dolfinx.__version__);
          print("Basix:", basix.__version__); print("UFL:", ufl.__version__);
          print(MPI.Get_library_version())'
      - name: Verify native UFL equations and fields with SciPy and blocked PETSc
        if: matrix.kind == 'fem-portable'
        run: pixi run --locked -e ${{ matrix.environment }} fem-portable-check
      - name: Verify native UFL equations and fields with PARDISO and blocked PETSc
        if: matrix.kind == 'fem-portable' && runner.os != 'macOS'
        run: pixi run --locked -e ${{ matrix.environment }} fem-portable-pardiso-check
      - name: Exercise generic native forms, spaces, contexts and workspaces
        if: matrix.kind == 'fem-portable'
        env:
          PYTEST_ADDOPTS: --junitxml=build/reports/tests/fem-portable.xml
        run: >-
          pixi run --locked -e ${{ matrix.environment }} python scripts/run_tests.py --
          tests/test_generic_forms_fenics.py tests/test_bound_spaces_fenics.py
          tests/test_bound_traces_fenics.py tests/test_context_fenics.py
          tests/test_form_workspace_fenics.py tests/test_fenics_integration.py
          tests/test_fenics_portability.py
      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'fem-portable' && always()
        with:
          name: fem-portable-${{ matrix.os }}
          path: |
            build/reports/fem-portable-*.json
            build/reports/tests/fem-portable-*.xml
      - name: Require native DOLFINx and PETSc
        if: matrix.kind == 'fem'
        run: >-
          pixi run --locked -e fem python -c
          'import dolfinx; from mpi4py import MPI; from petsc4py import PETSc;
          print("DOLFINx:", dolfinx.__version__);
          print("PETSc:", PETSc.Sys.getVersion()); print(MPI.Get_library_version())'
      - name: Exercise native DOLFINx assembly with branch coverage
        if: matrix.kind == 'fem'
        env:
          PYTEST_ADDOPTS: --capture=tee-sys --junitxml=build/reports/tests/fem.xml
        run: pixi run --locked -e fem test-fem-cov
      - name: Exercise native PETSc solver
        if: matrix.kind == 'fem'
        env:
          PYTEST_ADDOPTS: --capture=tee-sys --junitxml=build/reports/tests/petsc.xml
        run: pixi run --locked -e fem python scripts/run_tests.py -- tests/test_solvers.py -k 'native_optional_cpu_integration and petsc'
      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'fem' && always()
        with:
          name: test-results-fem-${{ matrix.os }}
          path: build/reports/tests/*.xml
      - name: Retain the native FEM coverage measurement
        uses: actions/upload-artifact@v7
        if: matrix.kind == 'fem'
        with:
          name: coverage-fem-linux
          path: build/reports/fem-coverage/.coverage
          include-hidden-files: true
          if-no-files-found: error
      - name: Require native MPI and MUMPS
        if: matrix.kind == 'mpi'
        run: >-
          pixi run --locked -e fem python -c
          'import shutil; from mpi4py import MPI; from petsc4py import PETSc;
          assert shutil.which("mpiexec"); assert PETSc.Sys.hasExternalPackage("mumps");
          print(MPI.Get_library_version())'
      - name: Exercise distributed assembly, solves and collective failures
        if: matrix.kind == 'mpi'
        env:
          PYTEST_ADDOPTS: --junitxml=build/reports/tests/mpi.xml
        run: pixi run --locked -e fem test-mpi
      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'mpi' && always()
        with:
          name: test-results-mpi-${{ matrix.os }}
          path: build/reports/tests/*.xml
      - name: Require native PARDISO
        if: matrix.kind == 'intel'
        run: pixi run --locked -e intel python -c 'import pypardiso'
      - name: Exercise native PARDISO solver
        if: matrix.kind == 'intel'
        run: pixi run --locked -e intel python scripts/run_tests.py -- tests/test_solvers.py tests/test_extended_local.py -k pardiso
      - name: Check generic local/global equations with native PARDISO and spawn
        if: matrix.kind == 'intel'
        run: pixi run --locked -e intel python scripts/run_tests.py -- tests/test_windows_portability.py
      - name: Build a Windows wheel with locked Intel dependencies
        if: matrix.kind == 'intel' && runner.os == 'Windows'
        run: >-
          pixi run --locked -e intel python -m build
          --wheel --no-isolation --outdir build/windows-wheel
      - name: Test installed Windows wheel with native PARDISO
        if: matrix.kind == 'intel' && runner.os == 'Windows'
        run: >-
          pixi run --locked -e intel python scripts/check_portable_wheel.py build/windows-wheel
          --require-pardiso --report build/reports/windows-pardiso-wheel.json
      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'intel' && runner.os == 'Windows' && always()
        with:
          name: wheel-windows-pardiso
          path: build/reports/windows-pardiso-wheel.*

  coverage:
    name: Combined core and native coverage
    needs: [core, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: test-core
          locked: true
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: coverage-core-linux
          path: build/reports/coverage-input/core
      - uses: actions/download-artifact@v8
        with:
          name: coverage-fem-linux
          path: build/reports/coverage-input/fem
      - name: Combine measurements from this checkout
        run: |
          mkdir -p build/reports/coverage
          pixi run --locked -e test-core python -m coverage combine --keep \
            --data-file=build/reports/coverage/.coverage \
            build/reports/coverage-input/core/.coverage \
            build/reports/coverage-input/fem/.coverage
      - name: Report and enforce independent 99% line and branch gates
        run: |
          pixi run --locked -e test-core python -m coverage xml --fail-under=0 \
            -o build/reports/coverage/coverage.xml
          pixi run --locked -e test-core python -m coverage json --fail-under=0 \
            -o build/reports/coverage/coverage.json
          pixi run --locked -e test-core python scripts/check_coverage.py \
            build/reports/coverage/coverage.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-combined
          path: |
            build/reports/coverage/coverage.xml
            build/reports/coverage/coverage.json
      - uses: codecov/codecov-action@v7
        with:
          files: build/reports/coverage/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  full-native:
    name: Complete CPU and two-GPU suite
    needs: core
    if: github.event_name == 'workflow_dispatch' && inputs.full_native
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 60
    concurrency:
      group: full-native-integration
      cancel-in-progress: false
    env:
      PYVISTA_OFF_SCREEN: "true"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: test
          locked: true
          cache: true
      - name: Build pinned native AmgX and PyAMGX
        run: pixi run --locked -e test test-setup-amgx
      - name: Require the complete native stack and two CUDA devices
        run: pixi run --locked -e test test-dependencies
      - name: Run all CPU workers followed by exclusive serial tests
        run: pixi run --locked -e test test-cov
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-full-native-linux-cuda
          path: build/reports/coverage/
