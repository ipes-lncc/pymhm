name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, environment: test-core}
          - {os: windows-latest, environment: test-core}
          - {os: macos-15, environment: test-core}
          - {os: macos-15-intel, environment: test-core}
          - {os: ubuntu-latest, environment: test-py311}
          - {os: ubuntu-latest, environment: test-py312}
    env:
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: ${{ matrix.environment }}
          locked: true
      - name: Check metadata
        run: pixi run --locked -e ${{ matrix.environment }} metadata-check
      - name: Run tests with branch coverage
        run: pixi run --locked -e ${{ matrix.environment }} test-cov
      - name: Build a portable wheel on Windows
        if: runner.os == 'Windows'
        run: >-
          pixi run --locked -e ${{ matrix.environment }} python -m build
          --wheel --no-isolation --outdir build/windows-wheel
      - name: Test the installed Windows wheel outside the checkout
        if: runner.os == 'Windows'
        run: >-
          pixi run --locked -e ${{ matrix.environment }} python scripts/check_portable_wheel.py
          build/windows-wheel --report build/reports/windows-wheel.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: wheel-windows-${{ matrix.environment }}
          path: build/reports/windows-wheel.*
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.environment }}
          path: build/reports/coverage/coverage.xml
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.environment == 'test-core'
        with:
          files: build/reports/coverage/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: test-core packaging
          locked: true
      - run: pixi run --locked -e test-core lint
      - run: pixi run --locked -e test-core format-check
      - run: pixi run --locked -e test-core typecheck
      - run: pixi run --locked -e packaging ci-check
      - run: pixi run --locked -e test-core build
      - run: pixi run --locked -e test-core check-dist
      - run: pixi run --locked -e packaging conda-build

  fem:
    name: DOLFINx integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: fem
          locked: true
      - run: pixi run --locked -e fem test-fem
      - name: Require native PETSc
        run: pixi run --locked -e fem python -c 'from petsc4py import PETSc; print(PETSc.Sys.getVersion())'
      - name: Exercise native PETSc solver
        run: pixi run --locked -e fem python scripts/run_tests.py -- tests/test_solvers.py -k 'native_optional_cpu_integration and petsc'

  mpi:
    name: Distributed MPI integration (two ranks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: fem
          locked: true
      - name: Require native MPI and MUMPS
        run: >-
          pixi run --locked -e fem python -c
          'import shutil; from mpi4py import MPI; from petsc4py import PETSc;
          assert shutil.which("mpiexec"); assert PETSc.Sys.hasExternalPackage("mumps");
          print(MPI.Get_library_version())'
      - name: Exercise distributed assembly, solves and collective failures
        run: pixi run --locked -e fem test-mpi

  intel:
    name: PARDISO integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: intel
          locked: true
      - name: Require native PARDISO
        run: pixi run --locked -e intel python -c 'import pypardiso'
      - name: Exercise native PARDISO solver
        run: pixi run --locked -e intel python scripts/run_tests.py -- tests/test_solvers.py tests/test_extended_local.py -k pardiso
      - name: Check generic local/global equations with native PARDISO and spawn
        run: pixi run --locked -e intel python scripts/run_tests.py -- tests/test_windows_portability.py
      - name: Build a Windows wheel with locked Intel dependencies
        if: runner.os == 'Windows'
        run: >-
          pixi run --locked -e intel python -m build
          --wheel --no-isolation --outdir build/windows-wheel
      - name: Test installed Windows wheel with native PARDISO
        if: runner.os == 'Windows'
        run: >-
          pixi run --locked -e intel python scripts/check_portable_wheel.py build/windows-wheel
          --require-pardiso --report build/reports/windows-pardiso-wheel.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: wheel-windows-pardiso
          path: build/reports/windows-pardiso-wheel.*

  meshing:
    name: Gmsh and Netgen integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: meshing
          locked: true
      - run: pixi run --locked -e meshing test-meshing

  remeshing:
    name: FreeFEM and BAMG integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: remeshing
          locked: true
      - name: Require native FreeFEM
        run: pixi run --locked -e remeshing python -c 'import shutil; assert shutil.which("FreeFem++-nw")'
      - name: Verify metric remeshing and polygon boundaries
        run: pixi run --locked -e remeshing python scripts/run_tests.py -- tests/test_metric_freefem.py tests/test_metric_adapt.py

  visualization:
    name: PyVista integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    env:
      PYVISTA_OFF_SCREEN: "true"
      OMP_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux offscreen runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libopengl0 libxrender1
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: visualization
          locked: true
      - name: Require native PyVista and VTK
        run: pixi run --locked -e visualization python -c 'import pyvista as pv; print(pv.__version__, pv.vtk_version_info)'
      - name: Validate native fields, file round trips and offscreen images
        run: pixi run --locked -e visualization test-visualization
