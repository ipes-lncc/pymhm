name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Release test acceptance
    uses: ./.github/workflows/tests.yml
    with:
      full_native: false
    secrets: inherit
    permissions:
      contents: read

  quality:
    name: Release quality and artifacts
    uses: ./.github/workflows/lint-and-quality.yml
    permissions:
      contents: read

  docs:
    name: Release documentation
    needs: [tests, quality]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'volpatto/pymhm'
    uses: ./.github/workflows/docs.yml
    with:
      publish: true
    permissions:
      contents: read
      pages: write
      id-token: write

  publish:
    name: Publish validated PyPI distributions
    needs: [tests, quality, docs]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'volpatto/pymhm'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pymhm/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
